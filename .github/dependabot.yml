version: 2

# W5-H4. Grouped so a weekly bump arrives as a few reviewable PRs rather than
# thirty. Majors are excluded from the grouped updates on purpose: Expo SDK,
# React Native and Next.js majors each need a migration guide read and a device
# or build check, which is a deliberate piece of work, not a merge.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      production-patches:
        applies-to: version-updates
        dependency-type: production
        update-types: [patch, minor]
      dev-tooling:
        applies-to: version-updates
        dependency-type: development
        update-types: [patch, minor]
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # Pinned deliberately: an implicit Stripe API-version change is a
      # payments incident, not a dependency bump (see docs audit PAY/DEPS).
      - dependency-name: stripe
        update-types: [version-update:semver-major]
      # Expo SDK and RN majors move together and require a native rebuild.
      - dependency-name: expo
        update-types: [version-update:semver-major]
      - dependency-name: react-native
        update-types: [version-update:semver-major]
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
